<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c9d4"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <radialGradient id="cloud1Grad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#d6cdb8"/>
    </radialGradient>
    <radialGradient id="cloud2Grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#c9b99a"/>
    </radialGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#6b5a42" flood-opacity="0.2"/>
    </filter>
    <filter id="cloudShadow2">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#6b5a42" flood-opacity="0.18"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="leafBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Subtle lighter patch suggesting hidden sun -->
  <ellipse cx="50" cy="55" rx="40" ry="30" fill="#e8d8b0" opacity="0.2"/>

  <!-- Back / second cloud (slightly behind, lower) -->
  <g filter="url(#cloudShadow2)">
    <circle cx="75" cy="120" r="22" fill="url(#cloud2Grad)"/>
    <circle cx="97" cy="113" r="25" fill="url(#cloud2Grad)"/>
    <circle cx="120" cy="116" r="20" fill="url(#cloud2Grad)"/>
    <circle cx="60" cy="126" r="18" fill="url(#cloud2Grad)"/>
    <circle cx="140" cy="122" r="18" fill="url(#cloud2Grad)"/>
    <rect x="58" y="122" width="90" height="28" rx="8" fill="url(#cloud2Grad)" filter="url(#softBlur)"/>
  </g>
  <!-- Cloud 2 highlight -->
  <path d="M78 108 Q100 102 118 108" stroke="#f0ead8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Front / main cloud (brighter, larger) -->
  <g filter="url(#cloudShadow)">
    <circle cx="100" cy="82" r="26" fill="url(#cloud1Grad)"/>
    <circle cx="125" cy="76" r="28" fill="url(#cloud1Grad)"/>
    <circle cx="148" cy="82" r="22" fill="url(#cloud1Grad)"/>
    <circle cx="80" cy="88" r="22" fill="url(#cloud1Grad)"/>
    <circle cx="168" cy="92" r="17" fill="url(#cloud1Grad)"/>
    <circle cx="115" cy="70" r="20" fill="url(#cloud1Grad)"/>
    <rect x="76" y="88" width="98" height="32" rx="10" fill="url(#cloud1Grad)" filter="url(#softBlur)"/>
  </g>
  <!-- Cloud 1 highlights -->
  <path d="M92 72 Q113 65 134 70" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M108 76 Q122 71 136 75" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Blowing leaf -->
  <g transform="rotate(-25, 42, 48)">
    <path d="M42 48 C46 40 56 38 58 44 C54 50 44 52 42 48 Z" fill="#4a7c59" opacity="0.85"/>
    <path d="M42 48 C50 44 56 41" stroke="#2d5a27" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Leaf stem trailing behind (showing motion) -->
    <path d="M42 48 C36 52 30 55 22 54" stroke="#2d5a27" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Second smaller leaf -->
  <g transform="rotate(15, 170, 65)">
    <path d="M170 65 C174 59 181 58 182 63 C179 68 171 69 170 65 Z" fill="#4a7c59" opacity="0.6"/>
    <path d="M170 65 C164 68 158 66" stroke="#2d5a27" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Ground -->
  <path d="M0 178 Q50 172 100 175 Q150 178 200 173 L200 200 L0 200 Z" fill="#4a7c59"/>
  <path d="M0 183 Q50 178 100 181 Q150 184 200 179 L200 200 L0 200 Z" fill="#2d5a27"/>

  <!-- Cozy mushroom, slightly to the left -->
  <path d="M58 180 C56 174 56 166 58 162 C59 158 65 158 66 162 C68 166 67 174 66 180 Z" fill="#f5f0e8"/>
  <path d="M46 163 C44 153 49 144 58 143 C67 142 73 149 72 159 C71 166 65 169 58 169 C51 169 47 166 46 163 Z" fill="#c17f59"/>
  <circle cx="55" cy="158" r="3" fill="#f5f0e8" opacity="0.85"/>
  <circle cx="64" cy="155" r="2.2" fill="#f5f0e8" opacity="0.8"/>
  <circle cx="57" cy="165" r="1.8" fill="#f5f0e8" opacity="0.65"/>
  <path d="M50 151 C54 147 60 146 65 148" stroke="#d4856a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
