<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a42"/>
      <stop offset="100%" stop-color="#4a5a68"/>
    </linearGradient>
    <radialGradient id="cloudGrad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#6a7888"/>
      <stop offset="100%" stop-color="#3a4550"/>
    </radialGradient>
    <radialGradient id="cloudGradDark" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#505f6a"/>
      <stop offset="100%" stop-color="#2a3540"/>
    </radialGradient>
    <radialGradient id="boltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7a1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f4a261" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e17055" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0a1018" flood-opacity="0.5"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="boltGlowFilter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="windowGlowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark stormy sky -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Lightning glow behind cloud -->
  <ellipse cx="115" cy="90" rx="35" ry="25" fill="#fff7a1" opacity="0.12" filter="url(#softBlur)"/>

  <!-- Massive dark storm cloud -->
  <g filter="url(#cloudShadow)">
    <circle cx="75" cy="56" r="30" fill="url(#cloudGradDark)"/>
    <circle cx="106" cy="44" r="36" fill="url(#cloudGradDark)"/>
    <circle cx="140" cy="54" r="28" fill="url(#cloudGradDark)"/>
    <circle cx="54" cy="66" r="22" fill="url(#cloudGrad)"/>
    <circle cx="164" cy="65" r="22" fill="url(#cloudGrad)"/>
    <circle cx="120" cy="38" r="24" fill="url(#cloudGradDark)"/>
    <circle cx="88" cy="40" r="24" fill="url(#cloudGradDark)"/>
    <rect x="50" y="66" width="124" height="38" rx="10" fill="url(#cloudGrad)" filter="url(#softBlur)"/>
  </g>

  <!-- Lightning bolt - golden yellow -->
  <g filter="url(#boltGlowFilter)">
    <!-- Bolt glow aura -->
    <path d="M118 72 L108 98 L116 98 L106 128 L124 95 L115 95 L125 72 Z" fill="#fff7a1" opacity="0.3"/>
    <!-- Main bolt -->
    <path d="M120 72 L110 98 L118 98 L108 128 L126 95 L117 95 L127 72 Z" fill="#d4a843"/>
    <!-- Bright core of bolt -->
    <path d="M120 75 L113 97 L119 97 L111 122 L124 97 L118 97 L123 75 Z" fill="#fff7a1" opacity="0.85"/>
  </g>

  <!-- Rain - angled and dense -->
  <g opacity="0.55" stroke="#7ab0c8" stroke-linecap="round">
    <line x1="52" y1="110" x2="46" y2="130" stroke-width="1.4"/>
    <line x1="65" y1="108" x2="59" y2="128" stroke-width="1.4"/>
    <line x1="80" y1="107" x2="74" y2="127" stroke-width="1.3"/>
    <line x1="148" y1="108" x2="142" y2="128" stroke-width="1.4"/>
    <line x1="162" y1="108" x2="156" y2="128" stroke-width="1.4"/>
    <line x1="174" y1="110" x2="168" y2="130" stroke-width="1.3"/>
    <line x1="57" y1="125" x2="51" y2="145" stroke-width="1.2" opacity="0.8"/>
    <line x1="72" y1="122" x2="66" y2="142" stroke-width="1.2" opacity="0.8"/>
    <line x1="152" y1="122" x2="146" y2="142" stroke-width="1.2" opacity="0.8"/>
    <line x1="168" y1="124" x2="162" y2="144" stroke-width="1.2" opacity="0.75"/>
  </g>

  <!-- Dark ground / silhouette hills -->
  <path d="M0 165 Q20 158 40 162 Q60 166 80 162 Q100 158 120 162 Q140 166 160 161 Q180 156 200 162 L200 200 L0 200 Z" fill="#1e2a1e"/>
  <path d="M0 170 Q50 164 100 168 Q150 172 200 167 L200 200 L0 200 Z" fill="#162216"/>

  <!-- Cottage/cabin silhouette (warm light inside) -->
  <!-- Cabin body -->
  <rect x="22" y="148" width="42" height="22" fill="#1a2418"/>
  <!-- Cabin roof (steep, cozy) -->
  <path d="M17 150 L43 132 L69 150 Z" fill="#141c12"/>
  <!-- Chimney -->
  <rect x="52" y="134" width="7" height="14" fill="#101810"/>
  <!-- Chimney smoke (barely visible) -->
  <path d="M55 134 C55 130 58 126 56 122 C54 118 58 114 57 110" stroke="#3a4a38" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Warm window glow -->
  <rect x="28" y="155" width="12" height="10" rx="1" fill="url(#windowGlow)" filter="url(#windowGlowFilter)"/>
  <rect x="28" y="155" width="12" height="10" rx="1" fill="#ffd166" opacity="0.7"/>
  <!-- Window pane cross -->
  <line x1="34" y1="155" x2="34" y2="165" stroke="#c8920a" stroke-width="0.8" opacity="0.6"/>
  <line x1="28" y1="160" x2="40" y2="160" stroke="#c8920a" stroke-width="0.8" opacity="0.6"/>

  <!-- Second small window -->
  <rect x="48" y="155" width="10" height="9" rx="1" fill="#ffd166" opacity="0.5" filter="url(#windowGlowFilter)"/>
  <rect x="48" y="155" width="10" height="9" rx="1" fill="#ffd166" opacity="0.4"/>

  <!-- Puddle in foreground -->
  <ellipse cx="150" cy="175" rx="26" ry="7" fill="#3a6080" opacity="0.5"/>
  <ellipse cx="150" cy="175" rx="14" ry="4" stroke="#5a80a0" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Tree silhouettes flanking cottage -->
  <rect x="8" y="142" width="5" height="28" fill="#1a2418"/>
  <path d="M-2 145 Q10 125 22 145 Z" fill="#141c12"/>
  <path d="M1 135 Q11 115 21 135 Z" fill="#141c12"/>

  <rect x="172" y="144" width="5" height="26" fill="#1a2418"/>
  <path d="M162 147 Q174 127 186 147 Z" fill="#141c12"/>
  <path d="M165 137 Q174 117 183 137 Z" fill="#141c12"/>
</svg>
