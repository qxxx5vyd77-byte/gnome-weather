<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a8a9e"/>
      <stop offset="100%" stop-color="#a8c0cc"/>
    </linearGradient>
    <radialGradient id="cloudGrad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#9ab0be"/>
      <stop offset="100%" stop-color="#5a7888"/>
    </radialGradient>
    <radialGradient id="puddle" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6a9aae" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#2a3a42" flood-opacity="0.3"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="rainGlow">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Dark cloud - large and dramatic -->
  <g filter="url(#cloudShadow)">
    <circle cx="88" cy="60" r="28" fill="url(#cloudGrad)"/>
    <circle cx="116" cy="52" r="32" fill="url(#cloudGrad)"/>
    <circle cx="145" cy="60" r="24" fill="url(#cloudGrad)"/>
    <circle cx="68" cy="68" r="22" fill="url(#cloudGrad)"/>
    <circle cx="164" cy="70" r="18" fill="url(#cloudGrad)"/>
    <circle cx="103" cy="44" r="22" fill="url(#cloudGrad)"/>
    <circle cx="130" cy="44" r="20" fill="url(#cloudGrad)"/>
    <rect x="64" y="66" width="108" height="34" rx="10" fill="url(#cloudGrad)" filter="url(#softBlur)"/>
  </g>
  <!-- Cloud highlight (subtle) -->
  <path d="M84 50 Q108 43 132 50" stroke="#b8c8d4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Rain drops - 7 falling lines -->
  <g opacity="0.8" filter="url(#rainGlow)">
    <!-- Rain line 1 -->
    <line x1="75" y1="108" x2="71" y2="130" stroke="#87ceeb" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rain line 2 -->
    <line x1="92" y1="105" x2="88" y2="128" stroke="#87ceeb" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rain line 3 -->
    <line x1="108" y1="103" x2="104" y2="127" stroke="#87ceeb" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rain line 4 -->
    <line x1="124" y1="104" x2="120" y2="128" stroke="#87ceeb" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rain line 5 -->
    <line x1="140" y1="106" x2="136" y2="130" stroke="#87ceeb" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rain line 6 -->
    <line x1="82" y1="125" x2="78" y2="148" stroke="#a8d8ea" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Rain line 7 -->
    <line x1="116" y1="122" x2="112" y2="146" stroke="#a8d8ea" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Rain line 8 -->
    <line x1="148" y1="124" x2="144" y2="147" stroke="#a8d8ea" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Mossy green ground -->
  <path d="M0 170 Q30 164 60 168 Q90 172 120 167 Q150 162 180 167 Q192 169 200 167 L200 200 L0 200 Z" fill="#4a7c59"/>
  <path d="M0 175 Q40 169 80 173 Q120 177 160 172 Q180 170 200 172 L200 200 L0 200 Z" fill="#3a6449"/>
  <path d="M0 180 Q50 175 100 178 Q150 181 200 177 L200 200 L0 200 Z" fill="#2d5a27"/>

  <!-- Puddle with ripple rings -->
  <ellipse cx="115" cy="170" rx="30" ry="8" fill="url(#puddle)"/>
  <!-- Ripple rings -->
  <ellipse cx="115" cy="170" rx="14" ry="4" stroke="#87ceeb" stroke-width="1" fill="none" opacity="0.6"/>
  <ellipse cx="115" cy="170" rx="22" ry="6" stroke="#87ceeb" stroke-width="1" fill="none" opacity="0.4"/>
  <ellipse cx="115" cy="170" rx="30" ry="8" stroke="#87ceeb" stroke-width="1" fill="none" opacity="0.2"/>
  <!-- Drop landing in puddle -->
  <circle cx="115" cy="167" r="1.5" fill="#a8d8ea" opacity="0.8"/>

  <!-- Rubber boot (wellies) - left corner -->
  <!-- Boot outline -->
  <g transform="translate(18, 145)">
    <!-- Boot leg -->
    <path d="M8 5 C6 5 5 8 5 12 L5 32 C5 35 7 37 12 38 L20 38 C22 36 24 34 24 32 L24 28 C24 26 22 25 20 24 L16 24 L16 5 C16 3 14 2 12 2 C10 2 8 3 8 5 Z" fill="#c17f59"/>
    <!-- Boot cuff/top fold -->
    <path d="M7 12 C6 10 6 8 8 7 L16 7 L16 12 C14 14 10 14 7 12 Z" fill="#a86040"/>
    <!-- Boot toe -->
    <path d="M5 32 C4 34 4 36 6 37 L22 39 C25 39 26 37 26 35 L26 32 Z" fill="#c17f59"/>
    <!-- Boot toe highlight -->
    <path d="M7 34 Q14 32 22 35" stroke="#d4956a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Cuff stripe detail -->
    <path d="M7 10 L15 10" stroke="#8b4a30" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Mud splash at base -->
    <path d="M3 38 Q10 42 18 40 Q24 38 28 40 Q22 44 14 44 Q6 44 3 38 Z" fill="#5a7a60" opacity="0.5"/>
  </g>

  <!-- Small second puddle -->
  <ellipse cx="52" cy="175" rx="14" ry="4" fill="url(#puddle)" opacity="0.7"/>
  <ellipse cx="52" cy="175" rx="9" ry="2.5" stroke="#87ceeb" stroke-width="0.8" fill="none" opacity="0.5"/>
  <ellipse cx="52" cy="175" rx="14" ry="4" stroke="#87ceeb" stroke-width="0.8" fill="none" opacity="0.3"/>
</svg>
