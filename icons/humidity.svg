<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0eff8"/>
      <stop offset="100%" stop-color="#f0f5e8"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c8e8f8"/>
      <stop offset="50%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#4a8db5"/>
    </linearGradient>
    <radialGradient id="dropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d8f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a8db5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dropShine" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aaa6a"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#2a5878" flood-opacity="0.25"/>
    </filter>
    <filter id="dropGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dewDrop">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#2a5878" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Soft background -->
  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- Background circles / soft watercolor spots -->
  <circle cx="160" cy="40" r="50" fill="#d4e8f8" opacity="0.25"/>
  <circle cx="40" cy="160" r="45" fill="#c8f0d8" opacity="0.2"/>

  <!-- Main water droplet shape -->
  <!-- Outer glow -->
  <path d="M100 20 C100 20 60 75 55 105 C52 128 74 155 100 155 C126 155 148 128 145 105 C140 75 100 20 100 20 Z" fill="url(#dropGlow)" filter="url(#dropGlowFilter)" opacity="0.6"/>

  <!-- Main droplet body -->
  <g filter="url(#dropShadow)">
    <path d="M100 28 C100 28 64 80 60 108 C57 130 76 152 100 152 C124 152 143 130 140 108 C136 80 100 28 100 28 Z" fill="url(#dropGrad)"/>
  </g>

  <!-- Droplet inner highlight/shine -->
  <path d="M100 28 C100 28 64 80 60 108 C57 130 76 152 100 152 C124 152 143 130 140 108 C136 80 100 28 100 28 Z" fill="url(#dropShine)"/>

  <!-- Inner bubble/shine spot -->
  <ellipse cx="84" cy="78" rx="14" ry="22" fill="white" opacity="0.25" transform="rotate(-15, 84, 78)"/>
  <ellipse cx="80" cy="68" rx="6" ry="10" fill="white" opacity="0.3" transform="rotate(-15, 80, 68)"/>

  <!-- Small shine dots -->
  <circle cx="78" cy="60" r="4" fill="white" opacity="0.35"/>
  <circle cx="86" cy="50" r="2.5" fill="white" opacity="0.25"/>

  <!-- Droplet surface tension line (bottom) -->
  <path d="M72 138 Q100 145 128 138" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.2"/>

  <!-- Leaf with dew drops -->
  <!-- Main leaf -->
  <g transform="translate(115, 130) rotate(35)">
    <path d="M0 50 C-5 35 -8 15 0 0 C8 -10 18 -5 15 15 C12 30 5 42 0 50 Z" fill="url(#leafGrad)" opacity="0.9"/>
    <!-- Leaf midrib -->
    <path d="M0 50 C0 35 1 18 2 5" stroke="#1e4020" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Leaf veins -->
    <path d="M2 20 C6 16 10 14 12 11" stroke="#2d5a27" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M1 30 C5 26 8 24 10 21" stroke="#2d5a27" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M1 20 C-3 17 -6 15 -8 12" stroke="#2d5a27" stroke-width="0.8" fill="none" opacity="0.45"/>
    <path d="M0 32 C-4 28 -7 26 -9 23" stroke="#2d5a27" stroke-width="0.8" fill="none" opacity="0.45"/>
  </g>

  <!-- Dew drops on the leaf -->
  <!-- Dew drop 1 (large) -->
  <g filter="url(#dewDrop)">
    <ellipse cx="148" cy="148" rx="7" ry="6" fill="#87ceeb" opacity="0.75"/>
    <ellipse cx="146" cy="146" rx="2.5" ry="2" fill="white" opacity="0.5"/>
  </g>
  <!-- Dew drop 2 -->
  <g filter="url(#dewDrop)">
    <ellipse cx="160" cy="158" rx="5.5" ry="4.5" fill="#87ceeb" opacity="0.7"/>
    <ellipse cx="158" cy="156" rx="2" ry="1.5" fill="white" opacity="0.45"/>
  </g>
  <!-- Dew drop 3 (tiny) -->
  <g filter="url(#dewDrop)">
    <ellipse cx="140" cy="162" rx="4" ry="3.5" fill="#a8d8ea" opacity="0.7"/>
    <ellipse cx="139" cy="161" rx="1.5" ry="1.2" fill="white" opacity="0.4"/>
  </g>
  <!-- Dew drop 4 (small) -->
  <g filter="url(#dewDrop)">
    <ellipse cx="168" cy="144" rx="4.5" ry="4" fill="#87ceeb" opacity="0.65"/>
    <ellipse cx="167" cy="143" rx="1.8" ry="1.4" fill="white" opacity="0.4"/>
  </g>
  <!-- Dew drop 5 (smallest, on leaf edge) -->
  <ellipse cx="175" cy="152" rx="3" ry="2.5" fill="#a8d8ea" opacity="0.6" filter="url(#dewDrop)"/>

  <!-- Tiny decorative water sparkles -->
  <path d="M38 90 L39 87 L40 90 L43 91 L40 92 L39 95 L38 92 L35 91 Z" fill="#87ceeb" opacity="0.6"/>
  <path d="M30 115 L31 113 L32 115 L34 116 L32 117 L31 119 L30 117 L28 116 Z" fill="#a8d8ea" opacity="0.5"/>
  <circle cx="45" cy="45" r="2" fill="#87ceeb" opacity="0.4"/>
  <circle cx="25" cy="70" r="1.5" fill="#a8d8ea" opacity="0.45"/>
</svg>
