<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#4a6070"/>
      <stop offset="100%" stop-color="#7a98a8"/>
    </linearGradient>
    <radialGradient id="cloudGrad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#7a9aaa"/>
      <stop offset="100%" stop-color="#3a5060"/>
    </radialGradient>
    <radialGradient id="puddle1" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7ab0c8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a80a0" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="3" dy="8" stdDeviation="7" flood-color="#1a2a34" flood-opacity="0.4"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark stormy sky background -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Very dark, dramatic cloud -->
  <g filter="url(#cloudShadow)">
    <circle cx="80" cy="52" r="28" fill="url(#cloudGrad)"/>
    <circle cx="108" cy="42" r="34" fill="url(#cloudGrad)"/>
    <circle cx="140" cy="52" r="26" fill="url(#cloudGrad)"/>
    <circle cx="60" cy="62" r="20" fill="url(#cloudGrad)"/>
    <circle cx="164" cy="62" r="20" fill="url(#cloudGrad)"/>
    <circle cx="120" cy="36" r="22" fill="url(#cloudGrad)"/>
    <circle cx="92" cy="38" r="22" fill="url(#cloudGrad)"/>
    <rect x="56" y="62" width="116" height="36" rx="10" fill="url(#cloudGrad)" filter="url(#softBlur)"/>
  </g>

  <!-- Dense angled rain (wind-driven) — many lines at ~20 degree angle -->
  <g opacity="0.75" stroke="#87ceeb" stroke-linecap="round">
    <!-- Row 1 of rain -->
    <line x1="60" y1="100" x2="52" y2="124" stroke-width="1.6"/>
    <line x1="74" y1="98" x2="66" y2="122" stroke-width="1.6"/>
    <line x1="88" y1="97" x2="80" y2="121" stroke-width="1.6"/>
    <line x1="102" y1="96" x2="94" y2="120" stroke-width="1.5"/>
    <line x1="116" y1="96" x2="108" y2="120" stroke-width="1.5"/>
    <line x1="130" y1="97" x2="122" y2="121" stroke-width="1.5"/>
    <line x1="144" y1="98" x2="136" y2="122" stroke-width="1.5"/>
    <line x1="158" y1="100" x2="150" y2="124" stroke-width="1.4"/>
    <!-- Row 2 of rain (offset) -->
    <line x1="54" y1="118" x2="46" y2="142" stroke-width="1.5" opacity="0.85"/>
    <line x1="68" y1="115" x2="60" y2="140" stroke-width="1.5" opacity="0.85"/>
    <line x1="82" y1="113" x2="74" y2="138" stroke-width="1.4" opacity="0.8"/>
    <line x1="96" y1="112" x2="88" y2="137" stroke-width="1.4" opacity="0.8"/>
    <line x1="110" y1="111" x2="102" y2="136" stroke-width="1.4" opacity="0.8"/>
    <line x1="124" y1="112" x2="116" y2="137" stroke-width="1.4" opacity="0.75"/>
    <line x1="138" y1="113" x2="130" y2="138" stroke-width="1.4" opacity="0.75"/>
    <line x1="152" y1="115" x2="144" y2="140" stroke-width="1.3" opacity="0.7"/>
    <line x1="166" y1="118" x2="158" y2="142" stroke-width="1.3" opacity="0.7"/>
    <!-- Row 3 -->
    <line x1="62" y1="136" x2="54" y2="158" stroke-width="1.3" opacity="0.7"/>
    <line x1="78" y1="132" x2="70" y2="155" stroke-width="1.3" opacity="0.7"/>
    <line x1="94" y1="130" x2="86" y2="153" stroke-width="1.3" opacity="0.65"/>
    <line x1="110" y1="129" x2="102" y2="152" stroke-width="1.3" opacity="0.65"/>
    <line x1="126" y1="130" x2="118" y2="153" stroke-width="1.2" opacity="0.6"/>
    <line x1="142" y1="132" x2="134" y2="155" stroke-width="1.2" opacity="0.6"/>
    <line x1="158" y1="134" x2="150" y2="157" stroke-width="1.1" opacity="0.55"/>
  </g>

  <!-- Ground - dark and wet -->
  <path d="M0 168 Q30 162 60 166 Q90 170 120 165 Q150 160 180 165 Q192 167 200 164 L200 200 L0 200 Z" fill="#3a5a44"/>
  <path d="M0 174 Q50 168 100 172 Q150 176 200 171 L200 200 L0 200 Z" fill="#2d5a27"/>

  <!-- Gnome holding mushroom cap as umbrella -->
  <!-- Mushroom umbrella cap (giant) -->
  <g filter="url(#glowFilter)">
    <!-- Mushroom cap umbrella -->
    <path d="M118 120 C114 105 118 92 130 90 C142 88 150 99 148 112 C147 120 140 124 130 124 C124 124 119 122 118 120 Z" fill="#c17f59"/>
    <!-- Umbrella cap inner shade -->
    <path d="M120 110 C124 104 132 103 140 107" stroke="#a86040" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Umbrella spots -->
    <circle cx="127" cy="112" r="2.8" fill="#f5f0e8" opacity="0.8"/>
    <circle cx="136" cy="109" r="2.2" fill="#f5f0e8" opacity="0.75"/>
    <!-- Handle stem -->
    <line x1="133" y1="124" x2="133" y2="138" stroke="#8b5e3c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Gnome body under mushroom umbrella -->
  <!-- Pointy hat (peeking out from under umbrella) -->
  <path d="M133 108 L137 124 L129 124 Z" fill="#8b3e22"/>
  <ellipse cx="133" cy="124" rx="5" ry="2" fill="#6b2e18"/>
  <!-- Tiny gnome head -->
  <circle cx="133" cy="130" r="5" fill="#c9956a"/>
  <!-- Gnome nose (big round gnome nose!) -->
  <circle cx="135" cy="131" r="2" fill="#e8956a"/>
  <!-- Gnome beard (tiny) -->
  <path d="M129 133 Q133 137 137 133" stroke="#f5f0e8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Gnome body/robe -->
  <path d="M127 135 C124 143 123 152 122 160 L144 160 C143 152 142 143 139 135 Z" fill="#8b5e3c"/>
  <!-- Belt -->
  <rect x="125" y="147" width="18" height="2.5" rx="1.2" fill="#6b3a1e" opacity="0.7"/>
  <!-- Tiny boots -->
  <ellipse cx="127" cy="161" rx="5" ry="2.5" fill="#4a3020"/>
  <ellipse cx="139" cy="161" rx="5" ry="2.5" fill="#4a3020"/>
  <!-- Gnome holding umbrella handle (arm) -->
  <path d="M137 138 C138 134 137 130 133 128" stroke="#c9956a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Puddles with multiple ripple rings -->
  <!-- Large puddle -->
  <ellipse cx="75" cy="173" rx="32" ry="9" fill="url(#puddle1)"/>
  <ellipse cx="75" cy="173" rx="14" ry="4" stroke="#87ceeb" stroke-width="1" fill="none" opacity="0.6"/>
  <ellipse cx="75" cy="173" rx="22" ry="6.5" stroke="#87ceeb" stroke-width="0.8" fill="none" opacity="0.4"/>
  <ellipse cx="75" cy="173" rx="30" ry="8.5" stroke="#87ceeb" stroke-width="0.7" fill="none" opacity="0.25"/>

  <!-- Small puddle -->
  <ellipse cx="165" cy="176" rx="18" ry="5" fill="url(#puddle1)" opacity="0.8"/>
  <ellipse cx="165" cy="176" rx="9" ry="2.5" stroke="#87ceeb" stroke-width="0.8" fill="none" opacity="0.55"/>
  <ellipse cx="165" cy="176" rx="16" ry="4.5" stroke="#87ceeb" stroke-width="0.7" fill="none" opacity="0.3"/>

  <!-- Rain drops hitting puddles -->
  <circle cx="62" cy="170" r="1.5" fill="#a8d8ea" opacity="0.7"/>
  <circle cx="88" cy="168" r="1.2" fill="#a8d8ea" opacity="0.7"/>
</svg>
