<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#e8f0f8"/>
    </linearGradient>
    <radialGradient id="cloudGrad" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#f8f4f0"/>
      <stop offset="100%" stop-color="#ccc8d8"/>
    </radialGradient>
    <radialGradient id="mushroomCap" cx="40%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d4eeff"/>
      <stop offset="100%" stop-color="#8aafcc"/>
    </radialGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#6080a0" flood-opacity="0.2"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="snowGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background - blue-white winter palette -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Soft white cloud -->
  <g filter="url(#cloudShadow)">
    <circle cx="92" cy="64" r="26" fill="url(#cloudGrad)"/>
    <circle cx="118" cy="56" r="30" fill="url(#cloudGrad)"/>
    <circle cx="144" cy="64" r="22" fill="url(#cloudGrad)"/>
    <circle cx="72" cy="72" r="20" fill="url(#cloudGrad)"/>
    <circle cx="162" cy="73" r="16" fill="url(#cloudGrad)"/>
    <circle cx="106" cy="50" r="20" fill="url(#cloudGrad)"/>
    <rect x="68" y="70" width="98" height="30" rx="8" fill="url(#cloudGrad)" filter="url(#softBlur)"/>
  </g>
  <!-- Cloud highlight -->
  <path d="M86 55 Q108 48 130 55" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Snowflakes - 5 geometric 6-pointed snowflakes -->

  <!-- Snowflake 1 (large, left) -->
  <g transform="translate(72, 112)" filter="url(#snowGlow)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#cce4f8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10.4" y1="-6" x2="10.4" y2="6" stroke="#cce4f8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10.4" y1="6" x2="10.4" y2="-6" stroke="#cce4f8" stroke-width="2" stroke-linecap="round"/>
    <!-- Branch tips -->
    <line x1="0" y1="-12" x2="-3" y2="-8" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="3" y2="-8" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="-3" y2="8" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="3" y2="8" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-10.4" y1="-6" x2="-8" y2="-2" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-10.4" y1="-6" x2="-6" y2="-9" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10.4" y1="6" x2="8" y2="2" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10.4" y1="6" x2="6" y2="9" stroke="#cce4f8" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#e8f4ff"/>
  </g>

  <!-- Snowflake 2 (medium, center) -->
  <g transform="translate(110, 108)" filter="url(#snowGlow)">
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#d4eeff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-7.8" y1="-4.5" x2="7.8" y2="4.5" stroke="#d4eeff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-7.8" y1="4.5" x2="7.8" y2="-4.5" stroke="#d4eeff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="-9" x2="-2.5" y2="-6" stroke="#d4eeff" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="-9" x2="2.5" y2="-6" stroke="#d4eeff" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="9" x2="-2.5" y2="6" stroke="#d4eeff" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="9" x2="2.5" y2="6" stroke="#d4eeff" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#e8f4ff"/>
  </g>

  <!-- Snowflake 3 (large, right) -->
  <g transform="translate(148, 115)" filter="url(#snowGlow)">
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#b8d8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5" stroke="#b8d8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5" stroke="#b8d8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="-3" y2="-7.5" stroke="#b8d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="3" y2="-7.5" stroke="#b8d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="9.5" y1="-5.5" x2="6.5" y2="-2" stroke="#b8d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="9.5" y1="-5.5" x2="8" y2="-9" stroke="#b8d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.2" fill="#e8f4ff"/>
  </g>

  <!-- Snowflake 4 (small, far left) -->
  <g transform="translate(45, 105)" filter="url(#snowGlow)" opacity="0.8">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#cce4f8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="-3.5" x2="6" y2="3.5" stroke="#cce4f8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="3.5" x2="6" y2="-3.5" stroke="#cce4f8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#e8f4ff"/>
  </g>

  <!-- Snowflake 5 (tiny, between others) -->
  <g transform="translate(88, 132)" filter="url(#snowGlow)" opacity="0.7">
    <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#cce4f8" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-4.8" y1="-2.8" x2="4.8" y2="2.8" stroke="#cce4f8" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-4.8" y1="2.8" x2="4.8" y2="-2.8" stroke="#cce4f8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#e8f4ff"/>
  </g>

  <!-- Snow on ground -->
  <path d="M0 174 Q30 165 60 170 Q90 175 120 168 Q150 161 180 168 Q192 171 200 168 L200 200 L0 200 Z" fill="#e8f4ff"/>
  <path d="M0 180 Q50 173 100 177 Q150 181 200 176 L200 200 L0 200 Z" fill="white"/>
  <!-- Snow bumps -->
  <path d="M0 174 Q15 168 30 172 Q45 176 60 170 Q75 164 90 168 Q105 172 120 167 Q135 162 150 166 Q165 170 180 167 Q192 165 200 168" stroke="#d4eeff" stroke-width="1.5" fill="none"/>

  <!-- Snow-covered mushroom -->
  <!-- Stem -->
  <path d="M101 180 C100 175 99 167 100 163 C101 159 107 159 108 163 C109 167 108 175 107 180 Z" fill="#e8e0d0"/>
  <!-- Snow on top of cap -->
  <path d="M90 162 C88 151 94 142 104 141 C114 140 120 148 118 158 C117 165 111 168 104 168 C97 168 91 165 90 162 Z" fill="url(#mushroomCap)"/>
  <!-- Snow dollop on cap -->
  <path d="M90 158 C89 151 94 143 104 142" stroke="#9ac4e0" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M88 160 C91 153 98 148 108 150 Q116 152 118 158" stroke="#d4eeff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M89 157 Q100 150 116 156" fill="#f0f8ff" stroke="none"/>
  <ellipse cx="103" cy="150" rx="16" ry="5" fill="white" opacity="0.85"/>
  <!-- Spots under snow -->
  <circle cx="100" cy="158" r="2.5" fill="#c4dcee" opacity="0.7"/>
  <circle cx="110" cy="156" r="2" fill="#c4dcee" opacity="0.65"/>
</svg>
